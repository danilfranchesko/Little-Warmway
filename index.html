<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172f35">
  <title>Тёплый маршрут</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <a class="brand" href="#" aria-label="Тёплый маршрут"><span class="brand-icon">▰</span><span data-i18n="title">Тёплый маршрут</span></a>
    <div class="top-actions"><span class="build" data-i18n="build">ПЕРВАЯ ПОЕЗДКА · 01</span><button id="language" class="icon-button" aria-label="Switch language">EN</button><button id="help" class="icon-button" aria-label="Как играть">?</button><button id="pause" class="icon-button" aria-label="Пауза">Ⅱ</button></div>
  </header>
  <section class="workspace">
    <aside class="sidebar">
      <div class="intro"><p class="eyebrow" data-i18n="district">КВАРТАЛ 01 / ТИХИЕ ДВОРИКИ</p><h1 id="level-title"></h1><p id="level-copy" class="description"></p></div>
      <nav id="levels" class="levels" aria-label="Уровни"></nav>
      <div class="stats"><div><span class="stat-label" data-i18n="homes">ОСВЕЩЕНО ДОМОВ</span><strong id="home-count">0 <small>/ 2</small></strong></div><div><span class="stat-label" data-i18n="charge">СВЕТ В ТРАМВАЕ</span><div id="battery" class="battery"></div></div></div>
      <div class="note"><span class="note-symbol">✧</span><p id="instruction"></p></div>
      <div class="controls"><div class="edit-controls"><button id="undo" class="secondary"><span>↶</span> <span data-i18n="undo">Шаг назад</span></button><button id="clear" class="secondary" data-i18n="clear">Сначала</button></div><button id="go" class="primary" disabled><span data-i18n="go">Поехали</span><span>→</span></button></div>
      <p class="sidebar-footer" data-i18n="footer">Маленькая поездка. Немного больше света.</p>
    </aside>
    <section class="scene" aria-label="Игровое поле">
      <div class="scene-heading"><span><i class="live-dot"></i><span id="scene-state"></span></span><span id="route-count"></span></div>
      <canvas id="board" aria-label="Карта улиц. Рисуйте маршрут от депо или нажимайте на соседние остановки."></canvas>
      <div class="scene-footer"><span><i class="legend-line"></i><span data-i18n="route">Ваш маршрут</span></span><span><i class="legend-dot"></i><span data-i18n="stop">Остановка</span></span><span><i class="legend-charge">ϟ</i><span data-i18n="station">Зарядка</span></span></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </section>
  </section>
</main>
<div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div id="modal-art" class="modal-art">✦</div><p id="modal-kicker" class="eyebrow"></p><h2 id="modal-title"></h2><div id="modal-copy"></div><button id="modal-primary" class="primary"></button><button id="modal-secondary" class="secondary" hidden></button></section></div>
<script src="js/levels.js"></script><script src="js/core.js"></script><script src="js/renderer.js"></script><script src="js/game.js"></script>
</body>
</html>
